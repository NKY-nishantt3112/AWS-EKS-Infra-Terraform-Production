name: Terraform Apply

on:
  pull_request:
    types: [closed]
    branches:
      - dev

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  terraform-apply: 
    if: github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'terraform-apply')
     
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra_code/env/dev/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851687812387:role/github-actions-terraform-apply-role-dev-acc
          role-session-name: GitHubActions-TerraformApply
          aws-region: ap-south-1

      - name: Installing Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Terraform Init
        run: terraform init

      - name: Terraform fmt
        run: terraform fmt

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file=dev.tfvars

      - name: Terraform Apply
        run: terraform apply --auto-approve -var-file=dev.tfvars
