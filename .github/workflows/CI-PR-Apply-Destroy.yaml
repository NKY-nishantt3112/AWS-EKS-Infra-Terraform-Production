name: Terraform Destroy (DEV)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm infra deletion"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    if: github.event.inputs.confirm == 'DESTROY'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra_code/env/dev/

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::851687812387:role/github-actions-terraform-apply-role-dev-acc
          role-session-name: GitHubActions-TerraformDestroy
          aws-region: ap-south-1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy --auto-approve -var-file=dev.tfvars
